; --- sprite bank and cursor, for the in-panel Sort/Lock buttons -------------
; All four patterns are the ones already proven unique for the minimap module
; (patches/minimap/src/sigs.h). No RenderSurface section is needed: minimap's
; RenderSurface resolves to 0x003E6A04, which is Inventory_DrawCtx above.

; 0x46B550(const char *path, void **outHandle). The module loads its own
; system\osmw_inventory.mda rather than editing a stock MDA, which has
; per-theme copies under defaultGui/greenGui/purpleGui that would drift.
