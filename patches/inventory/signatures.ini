; --- inventory grid, for the Lock mode ------------------------------------
; Only the page is needed: the slot under the cursor is computed from the
; grid geometry (origin 44,268 window-relative, 6x4 cells of 32px on a 40px
; pitch, derived from the draw callback's rect table at 0x41D220). A wire slot
; is global, so it is page * 24 + cell.
;
; Deliberately NOT hooking 0x42E68C the way chatmod does for item links: two
; mods on one function is the documented failure mode, and while Lock is armed
; the module owns the grid rect through its own node anyway.
[Inventory_InvPage]
