<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add POI</title>
    <script src="../common/theme.js"></script>
    <link rel="stylesheet" href="../common/style.css">
</head>
<body>
    <!-- Title bar -->
    <header class="title-bar">
        <div class="title-bar-drag">
            <span class="material-symbols-outlined title-bar-icon">location_on</span>
            <span class="title-bar-title">Add POI</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn title-btn-close" id="btnTitleClose" title="Close">✕</button>
        </div>
    </header>

    <div class="dialog-body">
        <div class="dialog-coord" id="coordText">
            <span class="material-symbols-outlined">my_location</span>
            <span id="coordValue">Position</span>
        </div>
        <label class="field">
            <span class="field-label">Label</span>
            <input type="text" id="labelInput" class="input" placeholder="e.g. Blacksmith, Portal" maxlength="60" autofocus>
        </label>
        <label class="field">
            <span class="field-label">Type</span>
            <select id="kindSelect" class="select">
                <option value="npc">Npc</option>
                <option value="shop">Shop</option>
                <option value="portal">Portal</option>
                <option value="quest">Quest</option>
                <option value="note">Note</option>
            </select>
        </label>
    </div>

    <footer class="footer" style="justify-content: flex-end; gap: 8px;">
        <button class="btn btn-primary" id="btnAdd">Save POI</button>
        <button class="btn" id="btnCancel">Cancel</button>
    </footer>

    <script src="add_poi.js"></script>
</body>
</html>
