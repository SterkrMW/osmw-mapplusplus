<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add POI</title>
    <link rel="stylesheet" href="../common/style.css">
    <style>
        .dialog-body { padding: 16px; flex: 1; }
        .dialog-coord { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; font-weight: 500; }
        .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .field-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    </style>
</head>
<body>
    <!-- Title bar -->
    <header class="title-bar">
        <div class="title-bar-drag">
            <span class="material-symbols-outlined title-bar-icon">location_on</span>
            <span class="title-bar-title">Add POI</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn title-btn-close" id="btnTitleClose" title="Close">✕</button>
        </div>
    </header>

    <div class="dialog-body">
        <div class="dialog-coord" id="coordText">Position</div>
        <label class="field">
            <span class="field-label">Label</span>
            <input type="text" id="labelInput" class="input" placeholder="e.g. Blacksmith, Portal" autofocus>
        </label>
        <label class="field">
            <span class="field-label">Type</span>
            <select id="kindSelect" class="select"></select>
        </label>
    </div>

    <footer class="footer" style="justify-content: flex-end; gap: 8px;">
        <button class="btn btn-primary" id="btnAdd">Add</button>
        <button class="btn" id="btnCancel">Cancel</button>
    </footer>

    <script src="add_poi.js"></script>
</body>
</html>
