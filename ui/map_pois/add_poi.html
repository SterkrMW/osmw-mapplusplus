<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add POI</title>
    <link rel="stylesheet" href="../common/style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            color: var(--text);
            overflow: hidden;
        }
        .dialog-body {
            padding: 16px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .dialog-coord {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            background: var(--bg-dark);
            padding: 6px 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .title-bar-icon {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <!-- Title bar -->
    <header class="title-bar">
        <div class="title-bar-drag">
            <span class="material-symbols-outlined title-bar-icon">location_on</span>
            <span class="title-bar-title">Add POI</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn title-btn-close" id="btnTitleClose" title="Close">✕</button>
        </div>
    </header>

    <div class="dialog-body">
        <div class="dialog-coord" id="coordText">
            <span class="material-symbols-outlined" style="font-size: 14px;">my_location</span>
            <span id="coordValue">Position</span>
        </div>
        <label class="field">
            <span class="field-label">Label</span>
            <input type="text" id="labelInput" class="input" placeholder="e.g. Blacksmith, Portal" autofocus>
        </label>
        <label class="field">
            <span class="field-label">Type</span>
            <select id="kindSelect" class="select">
                <option value="npc">Npc</option>
                <option value="shop">Shop</option>
                <option value="portal">Portal</option>
                <option value="quest">Quest</option>
                <option value="note">Note</option>
            </select>
        </label>
    </div>

    <footer class="footer" style="justify-content: flex-end; gap: 8px;">
        <button class="btn btn-primary" id="btnAdd">Save POI</button>
        <button class="btn" id="btnCancel">Cancel</button>
    </footer>

    <script src="add_poi.js"></script>
</body>
</html>
