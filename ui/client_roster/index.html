<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps++ Clients</title>
    <link rel="stylesheet" href="../common/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Title bar -->
    <header class="title-bar" id="title-bar">
        <div class="title-bar-drag">
            <span class="title-bar-icon">👥</span>
            <span class="title-bar-title">Maps++ Clients</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn title-btn-close" id="btnTitleClose" title="Close">✕</button>
        </div>
    </header>

    <!-- Table Container -->
    <div class="table-container">
        <table class="table" id="rosterTable">
            <thead>
                <tr>
                    <th>Character</th>
                    <th>Zone</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="rosterBody">
                <!-- Dynamically populated from client snapshots -->
            </tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display: none;">
            No game clients currently running.
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span class="footer-hint">Double-click a client to switch focus</span>
        <button class="btn btn-sm" id="btnClose">Close</button>
    </footer>

    <script src="main.js"></script>
</body>
</html>
