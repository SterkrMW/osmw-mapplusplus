<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Character</title>
    <link rel="stylesheet" href="../common/style.css">
</head>
<body>
    <!-- Title bar -->
    <header class="title-bar">
        <div class="title-bar-drag">
            <span class="material-symbols-outlined title-bar-icon">grid_view</span>
            <span class="title-bar-title">Main Character</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn title-btn-close" id="btnTitleClose" title="Close">✕</button>
        </div>
    </header>

    <div class="dialog-body">
        <div class="dialog-desc">Select the main character to pin for window layouts:</div>
        <label class="field">
            <select id="charSelect" class="select" autofocus></select>
        </label>
    </div>

    <footer class="footer" style="justify-content: flex-end; gap: 8px;">
        <button class="btn btn-primary" id="btnOk">OK</button>
        <button class="btn" id="btnCancel">Cancel</button>
    </footer>

    <script src="prompt.js"></script>
</body>
</html>
