<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Layouts</title>
    <script src="../common/theme.js"></script>
    <link rel="stylesheet" href="../common/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="title-bar">
        <div class="title-bar-drag">
            <span class="material-symbols-outlined title-bar-icon">grid_view</span>
            <span class="title-bar-title">Window Layouts</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn title-btn-close" id="btnTitleClose" title="Close">✕</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Saved layouts -->
        <aside class="rail rail-left">
            <h2 class="rail-title">Saved layouts</h2>
            <div class="rail-scroll">
                <ul class="layout-list" id="layoutList" role="listbox" aria-label="Saved layouts"></ul>
                <p class="rail-empty" id="layoutEmpty">
                    Nothing saved yet. Drag your clients where you want them, then
                    <strong>Capture</strong>.
                </p>
            </div>
            <div class="rail-actions">
                <button class="btn btn-sm" id="btnNew">New</button>
                <button class="btn btn-sm" id="btnDuplicate">Duplicate</button>
                <button class="btn btn-sm" id="btnRename">Rename</button>
                <button class="btn btn-sm btn-danger" id="btnDelete">Delete</button>
            </div>
        </aside>

        <!-- Stage -->
        <main class="stage-pane">
            <div class="toolbar">
                <button class="btn btn-sm btn-primary" id="btnCapture">
                    <span class="material-symbols-outlined tb-icon">devices</span>Capture current
                </button>
                <button class="btn btn-sm" id="btnAddSlot">Add slot</button>
                <span class="tb-sep" aria-hidden="true"></span>
                <label class="tb-field">
                    <span class="tb-label" id="snapLabel">Snap</span>
                    <select class="select select-sm" id="snapSelect" aria-labelledby="snapLabel">
                        <option value="0">Guides</option>
                        <option value="8">8 px</option>
                        <option value="16">16 px</option>
                        <option value="32">32 px</option>
                    </select>
                </label>
                <label class="tb-field">
                    <span class="tb-label" id="displayLabel">Display</span>
                    <select class="select select-sm" id="monitorSelect" aria-labelledby="displayLabel"></select>
                </label>
            </div>

            <div class="stage-wrap">
                <div class="stage-frame" id="stageFrame">
                    <div class="stage" id="stage" tabindex="0" aria-label="Layout canvas"></div>
                </div>
                <p class="stage-hint" id="stageHint">
                    Select a layout on the left, or capture your current window positions.
                </p>
            </div>
        </main>

        <!-- Selected slot -->
        <aside class="rail rail-right">
            <h2 class="rail-title">Slot</h2>
            <div class="rail-scroll" id="slotPanel">
                <p class="rail-empty" id="slotEmpty">Select a box on the canvas.</p>
                <div class="slot-form" id="slotForm" hidden>
                    <div class="xy-pair">
                        <label class="field">
                            <span class="field-label">X</span>
                            <input type="number" class="input input-sm" id="slotX" step="1">
                        </label>
                        <label class="field">
                            <span class="field-label">Y</span>
                            <input type="number" class="input input-sm" id="slotY" step="1">
                        </label>
                    </div>
                    <p class="field-note" id="slotSizeNote"></p>
                    <label class="field">
                        <span class="field-label">Character</span>
                        <select class="select select-sm" id="slotChar"></select>
                    </label>
                    <label class="check-row">
                        <input type="checkbox" id="slotFocus">
                        <span>Focus this window after applying</span>
                    </label>
                    <button class="btn btn-sm btn-danger" id="btnRemoveSlot">Remove slot</button>
                </div>
            </div>
            <div class="rail-actions rail-actions-stack">
                <button class="btn btn-sm" id="btnSetDefault">Set as default</button>
                <button class="btn btn-sm" id="btnUndo">Undo last apply</button>
            </div>
        </aside>
    </div>

    <footer class="footer">
        <div class="footer-left">
            <span class="status" id="status" role="status" aria-live="polite"></span>
        </div>
        <div class="footer-right">
            <button class="btn btn-sm" id="btnApply">Apply</button>
            <button class="btn btn-sm btn-primary" id="btnSave">Save</button>
            <button class="btn btn-sm" id="btnClose">Close</button>
        </div>
    </footer>

    <!-- Name prompt (new / rename) -->
    <div class="modal-overlay" id="nameModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
            <div class="modal-header">
                <span id="nameModalTitle">New layout</span>
                <button class="title-btn" id="btnNameCancelX" aria-label="Cancel">✕</button>
            </div>
            <div class="modal-body">
                <label class="field">
                    <span class="field-label">Name</span>
                    <input type="text" class="input" id="nameInput" maxlength="48" placeholder="e.g. Six Box — Main Left">
                </label>
                <label class="field" id="seedField">
                    <span class="field-label">Start from</span>
                    <select class="select" id="seedSelect"></select>
                </label>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="btnNameOk">Create</button>
                <button class="btn" id="btnNameCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
