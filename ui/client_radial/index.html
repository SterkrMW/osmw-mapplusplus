<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps++ Radial</title>
    <link rel="stylesheet" href="../common/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="radial" id="radial">
        <!-- Spokes are injected here, one per running client -->
        <div class="ring" id="ring"></div>

        <button class="hub" id="hub" title="Open the list view">
            <span class="hub-face hub-count">
                <span class="hub-num" id="hubNum">0</span>
                <span class="hub-sub" id="hubSub">clients</span>
            </span>
            <span class="hub-face hub-list">
                <span class="material-symbols-outlined hub-icon">format_list_bulleted</span>
                <span class="hub-sub">List view</span>
            </span>
        </button>
    </div>

    <script src="main.js"></script>
</body>
</html>
