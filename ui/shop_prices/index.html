<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Vendor</title>
    <script src="../common/theme.js"></script>
    <link rel="stylesheet" href="../common/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="title-bar">
        <div class="title-bar-drag">
            <span class="material-symbols-outlined title-bar-icon">inventory_2</span>
            <span class="title-bar-title" id="titleText">Character Vendor</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn title-btn-close" id="btnTitleClose" title="Close">✕</button>
        </div>
    </header>

    <div class="vendor-head">
        <label class="tb-field">
            <span class="tb-label" id="clientLabel">Client</span>
            <select class="select select-sm" id="clientSelect" aria-labelledby="clientLabel"></select>
        </label>
        <span class="badge badge-muted" id="guardBadge">Reading…</span>
        <span class="head-spacer"></span>
        <span class="listed-count" id="listedCount">0 of 24 listed</span>
        <button class="btn btn-sm" id="btnRefresh">Refresh</button>
    </div>

    <div class="vendor-body">
        <main class="grid-pane">
            <div class="bulk-bar">
                <span class="bulk-count" id="bulkCount">Nothing selected</span>
                <input type="text" class="input input-sm price-bulk" id="bulkPrice"
                       inputmode="numeric" autocomplete="off" placeholder="e.g. 1,500,000"
                       aria-label="Price to apply to the selected slots">
                <button class="btn btn-sm btn-primary" id="btnSetSelected">Set on selected</button>
                <button class="btn btn-sm" id="btnClearSelected">Clear</button>
                <span class="tb-sep" aria-hidden="true"></span>
                <button class="btn btn-sm" id="btnSelectAll">All</button>
                <button class="btn btn-sm" id="btnSelectNone">None</button>
            </div>

            <div class="grid-wrap" id="gridWrap">
                <div class="slot-grid" id="slotGrid" role="grid"
                     aria-label="Inventory slots"></div>
                <div class="marquee" id="marquee" hidden></div>
            </div>

            <div class="legend" id="legend" aria-hidden="true">
                <span class="legend-title">Magnitude</span>
                <span class="legend-item band-1"><i></i>hundreds</span>
                <span class="legend-item band-2"><i></i>thousands</span>
                <span class="legend-item band-3"><i></i>100k+</span>
                <span class="legend-item band-4"><i></i>millions</span>
                <span class="legend-item band-5"><i></i>10m+</span>
            </div>
        </main>

        <aside class="rail rail-right">
            <h2 class="rail-title">Presets</h2>
            <div class="rail-scroll">
                <ul class="preset-list" id="presetList" role="listbox"
                    aria-label="Saved presets"></ul>
                <p class="rail-empty" id="presetEmpty">
                    No presets yet. Price your shop, then <strong>Save current</strong>.
                </p>
            </div>
            <div class="rail-actions rail-actions-stack">
                <button class="btn btn-sm" id="btnPresetSave">Save current…</button>
                <button class="btn btn-sm" id="btnPresetLoad">Preview &amp; load…</button>
                <button class="btn btn-sm" id="btnPresetRename">Rename</button>
                <button class="btn btn-sm btn-danger" id="btnPresetDelete">Delete</button>
            </div>
        </aside>
    </div>

    <footer class="footer">
        <div class="footer-left">
            <span class="status" id="status" role="status" aria-live="polite"></span>
        </div>
        <div class="footer-right">
            <span class="apply-note">Check prices in game before you click <strong>Vendor</strong>.</span>
            <button class="btn btn-sm" id="btnRevert">Revert</button>
            <button class="btn btn-sm btn-primary" id="btnApply">Apply to game</button>
        </div>
    </footer>

    <!-- Preset diff preview. Presets are keyed by slot, so an inventory
         reorder silently repoints every price — this makes that visible
         before anything is loaded into the grid. -->
    <div class="modal-overlay" id="diffModal" hidden>
        <div class="modal modal-wide" role="dialog" aria-modal="true"
             aria-labelledby="diffTitle">
            <div class="modal-header">
                <span id="diffTitle">Preview</span>
                <button class="title-btn" id="btnDiffCancelX" aria-label="Cancel">✕</button>
            </div>
            <div class="modal-body">
                <div class="table-container">
                    <table class="table diff-table">
                        <thead>
                            <tr>
                                <th>Slot</th>
                                <th>Item</th>
                                <th>Now</th>
                                <th>Preset</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="diffBody"></tbody>
                    </table>
                </div>
                <p class="dialog-desc" id="diffSummary"></p>
            </div>
            <div class="modal-footer">
                <button class="btn" id="btnDiffCancel">Cancel</button>
                <button class="btn btn-primary" id="btnDiffOk">Load into grid</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
