; osMW Maps++ — shipped defaults
;
; One fallback layer for every tunable setting: config.ini (the user's own
; edits) always wins over this file, and this file always wins over the
; literal hardcoded at the read site in the .ahk source. Edit this file to
; change what a fresh install looks like — no AHK knowledge required.
;
; Never edited by the app itself. Deleting or renaming this file does not
; break anything; every setting just falls back to its hardcoded literal.
;
; Keys NOT listed here are intentionally excluded — see
; docs/superpowers/specs/2026-08-09-defaults-file-design.md section 3 for why
; (mostly: sentinel/migration logic that a defaults-chain fallback would
; break, or values that are per-machine/session state rather than a
; preference).

[Launcher]
GameArgs=
LaunchOnStartup=0
LaunchAutoLogin=1
MultiClientCount=5
MultiClientDelay=0
PrimaryMonitor=0
SecondaryMonitor=0
PrimaryLaunchLayout=__default__
SecondaryLaunchLayout=__default__
VersionCheck=1

[UI]
Mode=webview
AccentScheme=amber

[Core]
; Ordered managed-module manifest. main.exe and both compatibility launchers
; load only osmw_core.dll; feature membership and order change here without an
; executable repatch. Missing/incompatible entries fail independently.
Modules=osmw_chat.dll,osmw_login.dll,osmw_minimap.dll,osmw_fightspeed.dll,osmw_weather.dll,osmw_settings.dll,osmw_timers.dll,osmw_inventory.dll,osmw_fishing.dll

[Minimap]
Scale=100
Opacity=100
Anchor=Center
OffsetX=0
OffsetY=0
KeepOpenOnFocusLoss=0
ShowHoverCoords=1

; One row per shipped addon: 1 = enabled, 0 = disabled by default. Flip a
; value to change what a fresh install ships with enabled.
[Addons]
ChatToggle=1
ViewMode=1
WindowLayout=1
ShopPrices=1
InventoryToggle=1
QuickActions=1
MapPois=1
PartyMarkers=1
DiscordRpc=1
ClientRoster=1
BattleSend=1
BetterHotkeys=1
PartyHealth=1
Broadcast=0
; Native features are loaded by osmw_core.dll and read their own gates through
; the versioned API. A 0 stands down only that feature.
MinimapList=1
FightSpeed=1
Weather=1
Settings=1
; ChatMod is the chat window mod (font, position, clearing, channel tabs).
; On by default is
; safe: every [Chat] setting below defaults to "leave the client alone", so
; a fresh install behaves exactly as stock until someone opts in.
ChatMod=1
; F9 opens a small server-authoritative duration panel for Devil's Tears and
; Shapeshift effects. The native DLL reads this key once during startup.
Timers=1
; Adds a Sort control to the inventory. The client computes a proposed order;
; the server validates and persists it before returning authoritative data.
Inventory=1
; Graphical fishing panel. Stock clients are unchanged; missing
; system\osmw_fishing.mda keeps the same panel with text/arrows.
Fishing=1

; AutoLogin is the core-managed login-and-character-select feature. On by
; default is safe: with an empty roster the client is
; untouched. Rows live in login_roster.dat (DPAPI passwords), not here.
; Edit the roster with osmw_login_launch.exe --roster or ui/login_roster/.
AutoLogin=1

; Read through the core API by managed DLLs, not by Maps++ itself, out of the
; config.ini next to main.exe.
[Debug]
; Whether the managed native stack writes its tagged per-process diagnostic log
; in the game folder beside this file. Off is the default: nobody who is not
; investigating a problem needs launch logs.
; Flip it from Maps++'s Tray -> Debug -> Client Mod Logging. The value is read
; once, when a client is injected, so it applies to clients launched after the
; change rather than to ones already running.
ModLogging=0

; osmw_chat (the injected chat window mod). Every value here is "leave the
; client alone", so a fresh install behaves exactly as it always has until
; someone opts in. Changes apply when the chat window is next created, i.e.
; on the next character login.
[Chat]
; Face for the chat text. Empty = the client's own (Courier New on English).
FontFace=
; Height in pixels of the message text. 0 = the client's own (16).
; Two client limits bound this, both measured against the real renderer:
;   - 18 is the hard ceiling. Above it the client cuts the bottom rows of
;     every line: underscores vanish first, then the tails of y, g and q.
;     Nothing avoids this. Judge it on underscores, not descenders — at 19
;     the tails still look about right while the underscores have gone.
;   - Above a face's natural height, lines run off the right edge unless
;     FontWidth is pinned to 8. See FontWidth below. At 18 this does not
;     arise for Consolas or Cascadia Mono.
; patches/chatmod/tools/fontpresets.py picks combinations that respect both.
FontSize=0
; 0 = the client's own (400 / normal). 700 = bold.
FontWeight=0
; Forced character cell width. -1 = let GDI pick, which is what you want for
; any proportional face. The client hardcodes 8.
FontWidth=-1
; GDI font quality. -1 = the client's own (DEFAULT_QUALITY). 5 = ClearType.
FontQuality=-1
; The channel chips ("World", "System", ...) are drawn into a fixed 38x18 cell,
; so they take the face but not FontSize. Empty ChipFontFace = follow FontFace.
ChipFontFace=
; 0 = the client's own (12). Raising this clips the label against the cell.
ChipFontSize=0
; Character cell for the chip labels. -1 = fit the font. The labels are
; narrowed automatically if they would not fit the 38px chip, so this is
; only for overriding that.
ChipFontWidth=-1
; Height of the channel chips in pixels. 0 = follow the message font, so
; chips grow with FontSize instead of staying small beside larger text.
; The chips are stretched from the ones the client draws, so their colours
; and labels are always the client's own. Width stays 38 either way.
ChipHeight=0
; 1 = the chat window stays where you drag it instead of snapping back against
; the right edge of the game window. It also stops following the game window.
;
; With this on, the window is still PLACED once when it first appears: either
; back where you left it, or -- when there is nothing saved -- docked against
; the right edge of its own client, exactly where the unmodified game puts it.
; It only stops being moved after that.
FreePosition=0
; 1 = allow resizing. The client's own limits pin the height exactly. The
; window cannot usefully exceed 760x600 of client area, which is the size of
; the offscreen surface the client blits from.
UnlockSize=0
; 1 = remember the window's position and size across restarts. Written back to
; config.ini as WinRelX/WinRelY (position) and WinW/WinH (size) when you finish
; dragging or resizing. Only takes effect while FreePosition or UnlockSize is
; on.
;
; The position is stored as an OFFSET from the game window, not as a screen
; coordinate. Every client shares this one config.ini, so an absolute position
; put every multi-boxed client's chat window in the same spot, stacked on top of
; each other; an offset puts each one beside its own client, and survives you
; moving that client to another monitor.
;
; WinX/WinY are the old absolute pair. They are still read, converted to an
; offset the first time the window is restored, and then removed -- so an
; existing install keeps its position and nothing has to be re-done by hand.
;
; Turning this OFF re-docks the window against its client on the next pass,
; which is the honest reading of "stop remembering where I put it".
RememberGeometry=1
; A command, not a setting. Set to 1 (the Chat Mod settings tab has a button)
; and the mod forgets the saved position and size and docks the window against
; its client again, then writes this back to 0. It is consumed within a couple
; of seconds by a running client; with no client running, the next one to start
; consumes it. All running clients share this file, so they all reset.
ResetPosition=0
; System-wide hotkey that empties the chat, e.g. CTRL+SHIFT+C, ALT+F1,
; CTRL+DELETE. Empty = unbound, which is the default because a global hotkey
; is taken from every other application too. Anything can also clear by
; posting the registered window message "osmw_chat_clear" to the chat window.
; This clears the message source, so the in-game overlay empties along with
; the chat window. Your visible-line count (chatToggleSize) is preserved.
ClearHotkey=
; System-wide hotkey that cycles the channel filter: All -> Chat -> System.
; Chat is everything except System and Info; System is those two, which is
; where the server's announcements land. Empty = unbound. Anything can also
; switch by posting the registered message "osmw_chat_tab" to the chat
; window, with wParam 0 to cycle or 1/2/3 to pick All/Chat/System. While a
; filter is on, the window caption says so.
TabHotkey=
; 1 = draw a clickable All / Chat / System strip across the top of the chat
; pane. The chat text is pushed down to make room, so nothing is covered. An
; inactive tab shows an amber dot when its channels have taken traffic. Set
; to 0 if you would rather keep the full pane height and switch by hotkey.
TabStrip=1
; Face for the tab labels. Deliberately separate from FontFace: the strip is
; fixed-height chrome and has to stay legible whatever you set FontSize to.
TabStripFont=Tahoma
; Which tabs exist and what each one shows. Tabs are separated by |, a tab is
; "name:channels", and the channel list is comma separated where * means every
; channel and a leading - removes one. Order matters, so "*,-system" reads as
; "everything except system". Up to 6 tabs; names are what appear on the strip.
; Names are cut past 15 characters and the whole line past 255, both silently,
; which is why Settings has an "Edit tabs..." editor that refuses instead.
; Channels: local party pm guild market world system info fd gm
; Examples:  Trade:market       PMs:pm      Guild:guild,party
Tabs=All:*|Chat:*,-system,-info|System:system,info
; 1 = reopen the tab that was active at the end of the previous character
; session. The name, rather than the tab position, is stored so rearranging
; Tabs does not select a different category. If the name no longer exists,
; the first tab is used. All clients sharing this config share the last choice.
RememberActiveTab=1
; Written by ChatMod when the active tab changes. It is safe to leave empty.
ActiveTab=
; Background slot remembered for each tab name. Double-click unused space in
; the chat pane to cycle the active tab through the stock chat_back0.bmp ...
; chat_back4.bmp textures. Later entries for removed tabs are harmless.
TabBackgrounds=

; 1 = when a channel's cooldown blocks a message, say how long is left instead
; of the client's generic "Please do not flood !". The numbers come from the
; client's own gate and its per-channel table, so this only reports what the
; client already decided; the server enforces the cooldowns either way.
CooldownMessage=1
; The replacement text. %d is the seconds remaining, the first %s is "s" for
; the plural, the second %s is the channel name. Colour markup works as it does
; anywhere else. Leave the three placeholders in that order.
CooldownFormat=#R#S Wait %d more second%s before posting in %s again!#N
; 1 = scroll the chat with the mouse wheel while the chat window has focus.
; The window ships with scroll buttons but no wheel handling. This drives the
; client's own scroller, so it behaves exactly like pressing a button and the
; in-game chat overlay scrolls with it -- they share one view position.
WheelScroll=1
; Lines moved per wheel notch. 0 = follow the Windows setting, which is what
; every other application uses (Mouse control panel, usually 3).
WheelScrollLines=0
; 1 = show the time each message arrived, inline on the line. The client does
; not store a time on a message, so it is observed as the message arrives; the
; handful of messages already in the buffer when the client starts have no
; observed time and are left unstamped rather than given a made-up one.
; The stamp goes at the start of the line, before the sender name, so every
; channel lines up the same way:  [World] [12:34] Rajesh: hello
Timestamps=0
; How the stamp is written. %H hours, %M minutes, %S seconds, %% a literal
; percent; anything else is copied through, including the client's own colour
; markup, so "#c808080[%H:%M]#N" draws a dim grey time and returns to normal
; after it. Use #cRRGGBB for colour, not the letter codes: #K was measured
; against the real renderer and comes out identical to plain white.
; A space is always added after the stamp, so you do not need one here -- and
; could not have one anyway, since ini reads strip trailing whitespace.
;   #c808080[%H:%M]#N [12:34] dim grey  %H:%M       12:34, message colour
;   #c808080%H:%M#N   12:34 unbracketed %H:%M:%S    12:34:56 with seconds
; Colour only: the markup has no size code, and the letter codes are all
; colours except #U, which underlines. #K is NOT grey and #S is NOT small --
; both render identical to plain white. Use #cRRGGBB.
TimestampFormat=#c808080[%H:%M]#N
; 1 = mark messages that mention you. A mention is your character name
; appearing in the message text, or any PM. Mentioned lines get a marker, and
; an inactive tab holding one shows a red dot instead of the amber one.
HighlightMentions=1
; Your character name. Empty = read it from the game window's title bar, which
; is where the client puts it once you are in the world. Set this only if that
; stops working.
MyName=
; Character names whose chat this client hides, comma-separated. Matching is
; case-insensitive and exact against the sender name. Shared by every client
; using this game folder, and by every character you log in -- this is a
; client-level list, not the game's per-character ignore.
;
; New messages from these names never enter the client's ring, so they do not
; appear in the chat window OR the in-game overlay. Messages already in the
; overlay age out with the 1024-slot history; the chat window drops them on
; the next rebuild (within about two seconds of a list change).
;
; System and Info announcements are never dropped, even if the name matches.
; Cap 32 names, 20 characters each, no commas inside a name. Ctrl+left-click
; a sender name in the chat window adds them; unblock from Settings -> Chat
; Mod -> Edit blocked names. Empty = nobody blocked.
BlockedNames=
; Prepended to a mentioning line. Uses the client's own colour markup, so #R is
; red and #N returns to normal. Set empty for no marker (the tab dot remains).
MentionPrefix=#R>#N
; Diagnostic. A comma separated list of RRGGBB values that the colour probe
; renders into the pane, so a candidate palette can be judged against the real
; renderer on the real background. Empty = the probe draws its calibration
; ramps instead. Nothing here affects normal play; the probe only runs when
; asked, and the lines it draws exist solely in the chat window's private copy.
;   python patches/chatmod/tools/palette.py suggest 10
;   python patches/chatmod/tools/palette.py show
ProbePalette=
; Diagnostic. Text injected verbatim through the client's own markup renderer,
; semicolons separating lines. For answering "what does this markup actually
; do?" by looking instead of by reading the dispatcher table. Takes precedence
; over ProbePalette when both are set. Nothing here affects normal play.
ProbeText=

[ClientRoster]
AutoShowWithClients=0
DefaultView=radial

[QuickActions]
Actions=viewModeToggle,battleSend,inventoryOpenClick,chatToggleAll
Prewarm=1

[PartyHealth]
ShowPets=1
Mode=peek
PeekSeconds=3

[WindowLayout]
DefaultLayout=Grid2x2
MainCharacter=
TargetMonitor=0

[ShopPrices]
ConfirmHigh=0
PresetClears=0

[Discord]
Enabled=0

[MapPois]
LayerVisible=1
DefaultKind=npc

[PartyMarkers]
LayerVisible=1

; Broadcast is suspended (not in any variants\*.txt today) but its config
; already exists, so it's included for whenever it ships.
[Broadcast]
Modifier=!
Keys=1,2,3,4,5
Target=all
Exclude=

[Weather]
; Extra weather groups drawn by osmw_weather.dll on bits the stock client
; ignores. Every value here is the mod's own built-in fallback, so this
; section documents the shipped behaviour rather than changing it.
; The whole mod is gated by [Addons] Weather.
SandWind=14
AshDrift=1
BlizzardWind=18
EmberDrift=2
BloodWind=3
LeafSway=46
; 0 follows the server's intensity; 1-90 pins the mix.
FogAlpha=0
FogGradient=1
DarknessAlpha=0
; Gust depth as a percent of base density; 0 disables gusting.
Gust=35
; Hook the HUD weather-icon picker. Self-disables without the new artwork.
Icons=1
; Name our weathers in the hover tooltip and the chat status line instead of
; letting the client call all of them Sunny. Independent of Icons.
Names=1
