; osMW Maps++ — shipped defaults
;
; One fallback layer for every tunable setting: config.ini (the user's own
; edits) always wins over this file, and this file always wins over the
; literal hardcoded at the read site in the .ahk source. Edit this file to
; change what a fresh install looks like — no AHK knowledge required.
;
; Never edited by the app itself. Deleting or renaming this file does not
; break anything; every setting just falls back to its hardcoded literal.
;
; Keys NOT listed here are intentionally excluded — see
; docs/superpowers/specs/2026-08-09-defaults-file-design.md section 3 for why
; (mostly: sentinel/migration logic that a defaults-chain fallback would
; break, or values that are per-machine/session state rather than a
; preference).
;
; Only Maps++'s own settings live here. The native client mods are a separate,
; optional product with their own pair of files beside main.exe -- osmw.ini and
; osmw_defaults.ini. Maps++ touches them only through native_mods.ahk, and
; writes to osmw.ini only when the user asks for that specific change. It never
; ships, deploys or versions the mods, and Reset to Defaults leaves them alone.

[Launcher]
GameArgs=
LaunchOnStartup=0
LaunchAutoLogin=1
MultiClientCount=5
MultiClientDelay=0
PrimaryMonitor=0
SecondaryMonitor=0
PrimaryLaunchLayout=__default__
SecondaryLaunchLayout=__default__
VersionCheck=1

[UI]
Mode=webview
AccentScheme=amber

[Minimap]
; Who Tab belongs to: game (the game's own minimap wherever the client has one
; for this map, Maps++ elsewhere), mapspp (Maps++ wherever it has an image) or
; off (Tab always reaches the game). The "Open Maps++ minimap" action opens the
; overlay regardless.
Source=game
Scale=100
; 1 = multiply Scale by the game's own display scale (the client mods' 2x/3x),
; so the overlay keeps its size relative to the game picture.
FollowGameScale=1
Opacity=100
Anchor=Center
OffsetX=0
OffsetY=0
KeepOpenOnFocusLoss=0
ShowHoverCoords=1

; One row per shipped addon: 1 = enabled, 0 = disabled by default. Flip a
; value to change what a fresh install ships with enabled.
[Addons]
ChatToggle=1
ViewMode=1
WindowLayout=1
ShopPrices=1
InventoryToggle=1
QuickActions=1
MapPois=1
PartyMarkers=1
DiscordRpc=1
ClientRoster=1
BattleSend=1
BetterHotkeys=1
PartyHealth=1
Broadcast=0
; These two are Maps++ addons that edit a native mod's settings: the Chat Mod
; tab and the auto-login roster editor. Turning one off removes that editor
; from Maps++ and changes nothing in the game -- the mods' own gates have the
; same names, but they live in osmw.ini and only the player changes them.
ChatMod=1
AutoLogin=1

[ClientRoster]
AutoShowWithClients=0
DefaultView=radial

[QuickActions]
Actions=viewModeToggle,battleSend,inventoryOpenClick,chatToggleAll
Prewarm=1

[PartyHealth]
ShowPets=1
Mode=peek
PeekSeconds=3

[WindowLayout]
DefaultLayout=Grid2x2
MainCharacter=
TargetMonitor=0

[ShopPrices]
ConfirmHigh=0
PresetClears=0

[Discord]
Enabled=0

[MapPois]
LayerVisible=1
DefaultKind=npc

[PartyMarkers]
LayerVisible=1

; Broadcast is suspended (not in any variants\*.txt today) but its config
; already exists, so it's included for whenever it ships.
[Broadcast]
Modifier=!
Keys=1,2,3,4,5
Target=all
Exclude=
